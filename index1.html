<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ledger Calculator</title>
    <style>
        /* Your existing styles remain exactly the same */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .calculator {
            width: 380px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .display {
            width: 100%;
            height: 60px;
            font-size: 24px;
            text-align: right;
            padding: 15px;
            margin-bottom: 10px;
            border: none;
            border-radius: 15px;
            background: #f8f9fa;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
            font-weight: 500;
            letter-spacing: 1px;
        }
        .display:focus {
            outline: 2px solid #667eea;
        }
        .total-display {
            text-align: right;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 10px;
            color: #1976d2;
            font-size: 16px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 18px;
            font-size: 20px;
            font-weight: 600;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: #f8f9fa;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        button:hover {
            background: #e9ecef;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #adb5bd;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }
        .equal {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }
        .equal:hover {
            background: linear-gradient(135deg, #218838, #1eae81);
        }
        .clear {
            background: linear-gradient(135deg, #dc3545, #f86c6c);
            color: white;
        }
        .clear:hover {
            background: linear-gradient(135deg, #c82333, #e45a5a);
        }
        .special {
            background: linear-gradient(135deg, #007bff, #6610f2);
            color: white;
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            font-size: 16px;
        }
        .special:hover {
            background: linear-gradient(135deg, #0069d9, #520dc2);
        }
        .structured-output {
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
            font-size: 14px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        .structured-output div {
            padding: 8px;
            border-bottom: 1px solid #dee2e6;
            color: #495057;
        }
        .structured-output div:last-child {
            border-bottom: none;
        }
        .save-btn {
            background: linear-gradient(135deg, #ff8c42, #ff6b6b);
            color: white;
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-weight: 600;
        }
        .save-btn:hover {
            background: linear-gradient(135deg, #ff7a2a, #ff5252);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .save-btn:active {
            transform: translateY(0);
        }
        .delete-btn {
            background: linear-gradient(135deg, #dc3545, #f86c6c);
            color: white;
            padding: 12px 20px;
            margin: 5px;
            font-size: 14px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-weight: 600;
        }
        .delete-btn:hover {
            background: linear-gradient(135deg, #c82333, #e45a5a);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .delete-btn:active {
            transform: translateY(0);
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.3s ease-out;
        }
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal-content h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .modal-content label {
            display: block;
            margin-bottom: 5px;
            color: #495057;
            font-weight: 500;
            font-size: 14px;
        }
        .modal-content input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .modal-content input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .modal-content button {
            padding: 12px 20px;
            margin: 5px;
            font-size: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .modal-content button:hover {
            background: linear-gradient(135deg, #5a67d8, #6b46a0);
        }
        .modal-content hr {
            margin: 15px 0;
            border: none;
            border-top: 2px solid #e9ecef;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .notify {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff4d4d;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 9999;
        }
        .notify.show {
            opacity: 1;
            transform: translateY(0);
        }
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .confirm-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            animation: popupScale 0.2s ease;
        }
        .confirm-box h3 {
            margin-bottom: 10px;
        }
        .confirm-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
        }
        .confirm-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #confirmYes {
            background: #e74c3c;
            color: white;
        }
        #confirmNo {
            background: #ccc;
        }
        @keyframes popupScale {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div id="notify" class="notify"></div>
        <div id="structuredOutput" class="structured-output"></div>
        <input type="text" id="display" class="display" readonly placeholder="0">
        <div id="totalDisplay" class="total-display"></div>
        <div class="buttons">
            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button onclick="append('/')">÷</button>
            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="append('*')">×</button>
            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="append('-')">−</button>
            <button class="clear" onclick="clearAll()">C</button>
            <button onclick="append('0')">0</button>
            <button id="equalBtn" class="equal" onclick="calculate()">=</button>
            <button onclick="append('+')">+</button>
            <button class="special" onclick="correction()" style="background: linear-gradient(135deg, #ff8c42, #ff6b6b);">⌫</button>
            <button class="special" onclick="useResult()">📋Use Result</button>
            <button class="special" onclick="openSavedScreen()">📁 History</button>
            <button class="save-btn" onclick="saveStructuredData()">💾 Save Data</button>
        </div>
    </div>

    <div id="confirmPopup" class="confirm-overlay">
        <div class="confirm-box">
            <h3>Delete Confirmation</h3>
            <p>Are you sure you want to delete this calculation?</p>
            <div class="confirm-buttons">
                <button id="confirmYes">Yes</button>
                <button id="confirmNo">Cancel</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        // DOM Elements
        const display = document.getElementById("display");
        const totalDisplay = document.getElementById("totalDisplay");
        const structuredOutput = document.getElementById("structuredOutput");
        const equalBtn = document.getElementById("equalBtn");
        const modal = document.getElementById("modal");
        const modalContent = document.getElementById("modalContent");
        const redColor = '#ff4d4d';
        const greenColor = '#41dc8e';

        // State Variables
        let currentCalc = null;
        let savedCalculations = [];
        let fullLedger = "";
        let tempExpression = "";
        let singleValueMode = false;
        let isDataSaved = false;
        let result1 = 0;
        let pendingDeleteIndex = null;

        // FIX 1: Load saved calculations from localStorage when app starts
        function loadSavedCalculations() {
            try {
                const stored = localStorage.getItem('smartLedgerCalculations');
                if (stored) {
                    savedCalculations = JSON.parse(stored);
                }
            } catch (e) {
                console.error('Error loading saved calculations:', e);
                savedCalculations = [];
            }
        }

        // FIX 1: Save calculations to localStorage
        function saveToLocalStorage() {
            try {
                localStorage.setItem('smartLedgerCalculations', JSON.stringify(savedCalculations));
            } catch (e) {
                console.error('Error saving to localStorage:', e);
                showNotification('Error saving data', redColor);
            }
        }

        // Load saved data on startup
        loadSavedCalculations();

        function correction() {
            if (display.value.length > 0) {
                display.value = display.value.slice(0, -1);
            }
        }

        function append(value) {
            if (equalBtn.disabled) return;
            display.value += value;
        }

        function clearAll() {
            display.value = "";
            totalDisplay.innerHTML = "";
            structuredOutput.innerHTML = "";
            fullLedger = "";
            equalBtn.disabled = false;
            currentCalc = null;
            isDataSaved = false;
            result1 = 0;
        }

        function calculate() {
            if (!display.value || !/[+\-*/]/.test(display.value) || /^[+\-*/]/.test(display.value) || /[+\-*/]$/.test(display.value) || /[+\-*/]{2,}/.test(display.value)) {
                showNotification("Please enter a valid calculation", redColor);
                return;
            }

            tempExpression = display.value;

            if (!/[+\-*/]/.test(tempExpression)) {
                singleValueMode = true;
                openDescriptionModal([tempExpression]);
                return;
            }

            singleValueMode = false;
            const tokens = tempExpression.split(/([+\-*/])/);
            const numbers = tokens.filter(token => !isNaN(token) && token !== "");
            const operator1 = tokens.filter(token => isNaN(token) && token !== "");
            openDescriptionModal(numbers, operator1);
        }

        function openDescriptionModal(numbers, operator1) {
            modal.style.display = "flex";
            let html = `<h3>${singleValueMode ? 'Enter Value Details' : 'Enter Calculation Details'}</h3>
                        <div id="descInputs"></div>`;

            if (!singleValueMode) {
                html += `<label><strong>Result Description:</strong></label>
                        <input type="text" id="resultDesc" placeholder="e.g., Total Amount" style="width:100%; margin-bottom:15px;">`;
            }

            html += `<label><strong>Transaction Date (DD-MM-YYYY):</strong></label>
                    <input type="date" id="transactionDate" placeholder="DD-MM-YYYY" style="width:100%; margin-bottom:20px;">
                    <div style="display: flex; gap: 10px; justify-content: flex-end;">
                        <button onclick="submitDetails()" style="flex: 1;">Confirm</button>
                        <button onclick="closeModal()" style="flex: 1; background: #6c757d;">Cancel</button>
                    </div>`;

            modalContent.innerHTML = html;
            const descInputs = document.getElementById("descInputs");
            
            if (numbers) {
                numbers.forEach((num, index) => {
                    descInputs.innerHTML += `<label><strong>Value ${index + 1} (${num} ${operator1 && operator1[index] ? operator1[index] : '='}) Description:</strong></label>
                                            <input type="text" id="desc_${index}" placeholder="Enter description for ${num}" style="width:100%; margin-bottom:15px;">`;
                });
            }
        }

        function submitDetails() {
            const tokens = tempExpression.split(/([+\-*/])/);
            let descIndex = 0;
            const values = [];
            
            tokens.forEach(token => {
                if (!isNaN(token) && token !== "") {
                    const desc = document.getElementById("desc_" + descIndex)?.value || "No description";
                    values.push({ number: token, description: desc });
                    descIndex++;
                }
            });

            const transactionDate = document.getElementById("transactionDate")?.value || "Not specified";
            const currentDate = new Date().toLocaleDateString('en-GB');
            let result;
            let resultDesc;

            if (singleValueMode) {
                result = tempExpression;
                resultDesc = values[0]?.description || "No description";
            } else {
                try {
                    let stepResult = parseFloat(tokens[0]);
                    for (let i = 1; i < tokens.length; i += 2) {
                        const operator = tokens[i];
                        const nextNumber = parseFloat(tokens[i + 1]);
                        switch (operator) {
                            case "+": stepResult += nextNumber; break;
                            case "-": stepResult -= nextNumber; break;
                            case "*": stepResult *= nextNumber; break;
                            case "/": 
                                if (nextNumber === 0) {
                                    showNotification("Cannot divide by zero", redColor);
                                    closeModal();
                                    return;
                                }
                                stepResult /= nextNumber; 
                                break;
                        }
                    }
                    result = Math.round(stepResult);
                } catch (error) {
                    showNotification("Invalid calculation", redColor);
                    return;
                }
                resultDesc = document.getElementById("resultDesc")?.value || "No description";
            }

            currentCalc = {
                expression: tempExpression,
                values,
                result,
                resultDescription: resultDesc,
                transactionDate,
                currentDate
            };

            totalDisplay.innerHTML = `${tempExpression} = ${result}`;
            structuredOutput.innerHTML = "";
            renderStructured(currentCalc);
            closeModal();
            equalBtn.disabled = true;
            isDataSaved = false;
        }

        function renderStructured(calc) {
            let html = "";
            const tokens = calc.expression.split(/([+\-*/])/);
            let stepResult = parseFloat(tokens[0]);
            let firstDesc = calc.values[0]?.description || "Unknown";
            let valueIndex = 1;

            for (let i = 1; i < tokens.length; i += 2) {
                const operator = tokens[i];
                const nextNumber = parseFloat(tokens[i + 1]);
                const nextDesc = calc.values[valueIndex]?.description || "Unknown";
                const previousResult = stepResult;

                switch (operator) {
                    case "+": stepResult += nextNumber; break;
                    case "-": stepResult -= nextNumber; break;
                    case "*": stepResult *= nextNumber; break;
                    case "/": 
                        if (nextNumber === 0) {
                            showNotification("Cannot divide by zero", redColor);
                            closeModal();
                            return;
                        }
                        stepResult /= nextNumber; 
                        break;
                }
                
                stepResult = Math.round(stepResult);
                html += `<div>
                            <strong>${previousResult}</strong> (${firstDesc}) ${operator === "*" ? "×" : operator === "/" ? "÷" : operator} 
                            <strong>${nextNumber}</strong> (${nextDesc}) = <strong>${stepResult}</strong> (${i + 2 >= tokens.length ? calc.resultDescription : "Total"})
                        </div>`;
                
                firstDesc = i + 2 >= tokens.length ? calc.resultDescription : "Total";
                valueIndex++;
            }

            structuredOutput.innerHTML = html;
            fullLedger = html;
        }

        function useResult() {
            if (!result1) {
                showNotification("No result available! Please calculate something first.", redColor);
                return;
            }
            display.value = result1;
            totalDisplay.innerHTML = "";
            equalBtn.disabled = false;
        }

        function saveStructuredData() {
            if (!currentCalc) {
                showNotification("No calculation to save! Please calculate something first.", redColor);
                return;
            }

            if (isDataSaved) {
                showNotification("This calculation is already saved!", redColor);
                return;
            }

            savedCalculations.push({
                result: currentCalc.result,
                ledger: fullLedger,
                transactionDate: currentCalc.transactionDate || "Not specified",
                currentDate: currentCalc.currentDate || new Date().toLocaleDateString('en-GB'),
                expression: currentCalc.expression,
                values: currentCalc.values,
                resultDescription: currentCalc.resultDescription
            });

            // FIX 1: Save to localStorage after adding
            saveToLocalStorage();

            isDataSaved = true;
            showNotification("Calculation saved successfully!", greenColor);
            structuredOutput.innerHTML = "";
            result1 = currentCalc.result;
            currentCalc = null;
        }

        function openSavedScreen() {
            if (savedCalculations.length === 0) {
                showNotification("No saved results available!", greenColor);
                return;
            }

            savedCalculations.sort((a, b) => {
                if (a.transactionDate === "Not specified") return 1;
                if (b.transactionDate === "Not specified") return -1;
                
                if (a.transactionDate && b.transactionDate) {
                    const [aDay, aMonth, aYear] = a.transactionDate.split("-").map(Number);
                    const [bDay, bMonth, bYear] = b.transactionDate.split("-").map(Number);
                    if (aYear && bYear) {
                        const dateA = new Date(aYear, aMonth - 1, aDay);
                        const dateB = new Date(bYear, bMonth - 1, bDay);
                        return dateB - dateA;
                    }
                }
                return 0;
            });

            modal.style.display = "flex";
            let html = `<h3>📁 Saved Results</h3><hr>`;

            savedCalculations.forEach((calc, index) => {
                html += `<div style="padding: 12px; border-bottom: 1px solid #dee2e6; cursor: pointer; transition: background 0.3s;" 
                            onmouseover="this.style.background='#f8f9fa'" 
                            onmouseout="this.style.background='transparent'" 
                            onclick="openDetail(${index})">
                            <strong>Result: ${calc.result}</strong><br>
                            <small style="color: #6c757d;">📅 ${calc.transactionDate || 'Not specified'}</small>
                        </div>`;
            });

            html += `<div style="margin-top: 20px; text-align: right;">
                        <button onclick="closeModal()">Close</button>
                    </div>`;

            modalContent.innerHTML = html;
        }

        function openDetail(index) {
            const calc = savedCalculations[index];
            const cleanLedger = calc.ledger.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ');
            
            // Store index for delete operation
            pendingDeleteIndex = index;

            const html = `<h3>📊 Calculation Details</h3>
                        <p><strong>📅 Transaction Date:</strong> ${calc.transactionDate || 'Not specified'}</p>
                        <p><strong>💾 Saved Date:</strong> ${calc.currentDate || 'Not specified'}</p>
                        <p><strong>🔢 Expression:</strong> ${calc.expression}</p>
                        <hr>
                        <div style="max-height: 300px; overflow-y: auto; background: #f8f9fa; padding: 15px; border-radius: 10px; font-family: monospace;">
                            ${calc.ledger}
                        </div>
                        <div style="margin-top: 15px; padding: 10px; background: #e3f2fd; border-radius: 10px; text-align: center;">
                            <strong>Final Result: ${calc.result}</strong> (${calc.resultDescription})
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
                            <button onclick="shareCalculation(${index})" style="flex: 1;">📤 Share</button>
                            <button class="delete-btn" onclick="showDeleteConfirmation()" style="flex: 1;">🗑️ Delete</button>
                            <button onclick="openSavedScreen()" style="flex: 1; background: #6c757d;">Close</button>
                        </div>`;

            modalContent.innerHTML = html;
        }

        // FIX 2: Improved share function for WebView
        function shareCalculation(index) {
            const calc = savedCalculations[index];
            const cleanLedger = calc.ledger.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ');
            
            const shareText = `📊 Calculation Details
══════════════════════
📅 Transaction Date: ${calc.transactionDate || 'Not specified'}
💾 Saved Date: ${calc.currentDate || 'Not specified'}
══════════════════════
${cleanLedger}
══════════════════════
Final Result: ${calc.result}`;

            // Try Web Share API first
            if (navigator.share && window.innerWidth <= 768) { // Assume mobile
                navigator.share({
                    title: 'Calculation Details',
                    text: shareText,
                }).catch((error) => {
                    console.log('Share error:', error);
                    // Fallback to clipboard
                    copyToClipboard(shareText);
                });
            } else {
                // Fallback for desktop or when Web Share fails
                copyToClipboard(shareText);
            }
        }

        // Helper function for clipboard copy
        function copyToClipboard(text) {
            // Try modern clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification("Copied to clipboard!", greenColor);
                }).catch(() => {
                    // Fallback for older browsers
                    fallbackCopyToClipboard(text);
                });
            } else {
                // Fallback for older browsers
                fallbackCopyToClipboard(text);
            }
        }

        // Fallback copy method
        function fallbackCopyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showNotification("Copied to clipboard!", greenColor);
            } catch (err) {
                showNotification("Sharing not supported", redColor);
            }
            
            document.body.removeChild(textarea);
        }

        function showDeleteConfirmation() {
            const popup = document.getElementById("confirmPopup");
            popup.style.display = "flex";
        }

        function deleteCalculation() {
            if (pendingDeleteIndex !== null) {
                savedCalculations.splice(pendingDeleteIndex, 1);
                // FIX 1: Save to localStorage after deletion
                saveToLocalStorage();
                
                const popup = document.getElementById("confirmPopup");
                popup.style.display = "none";
                
                if (savedCalculations.length > 0) {
                    openSavedScreen();
                } else {
                    closeModal();
                    showNotification("No saved calculations remaining.", redColor);
                }
                pendingDeleteIndex = null;
            }
        }

        function closeModal() {
            modal.style.display = "none";
            pendingDeleteIndex = null;
        }

        // Setup confirmation buttons
        document.getElementById("confirmYes").onclick = function() {
            deleteCalculation();
        };

        document.getElementById("confirmNo").onclick = function() {
            document.getElementById("confirmPopup").style.display = "none";
            pendingDeleteIndex = null;
        };

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'flex') return;
            const key = e.key;
            if (!isNaN(key) || ['+', '-', '*', '/', '.', 'Enter', 'Escape', 'Backspace'].includes(key)) {
                e.preventDefault();
                if (key === 'Enter') {
                    calculate();
                } else if (key === 'Escape') {
                    clearAll();
                } else if (key === 'Backspace') {
                    correction();
                } else {
                    append(key);
                }
            }
        });

        window.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
            if (event.target === document.getElementById("confirmPopup")) {
                document.getElementById("confirmPopup").style.display = "none";
                pendingDeleteIndex = null;
            }
        };

        function showNotification(message, color) {
            const notify = document.getElementById("notify");
            notify.textContent = message;
            notify.classList.add("show");
            notify.style.backgroundColor = color;
            setTimeout(() => {
                notify.classList.remove("show");
            }, 1000);
        }
    </script>
</body>
</html>
